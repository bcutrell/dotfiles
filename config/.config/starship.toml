"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
# A slow git status in a huge repo gives up instead of stalling the prompt.
command_timeout = 200

# Only cheap modules. Language modules (rust, go, node, ...) run a version
# command on every prompt; rustup's shim alone can add over a second.
format = '$directory$git_branch$git_state$git_status$python$cmd_duration$line_break$character'

# Show python only for an active venv, by name: no `python --version` per prompt.
[python]
detect_extensions = []
detect_files = []
format = 'via [$virtualenv]($style) '

[cmd_duration]
min_time = 2_000
