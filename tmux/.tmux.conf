set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc,alacritty:Tc,wezterm:Tc,tmux-256color:Tc'
set -as terminal-features ',xterm*:clipboard,alacritty:clipboard,wezterm:clipboard,tmux-256color:clipboard'
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
set -g set-clipboard on          # tmux's own copies emit OSC 52 too, so yanks reach the local clipboard over ssh
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind %
unbind '"'
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

set -g status-style bg=black,fg=white
set -g window-status-current-style bg=white,fg=black,bold
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%Y-%m-%d"
set -g status-right-length 30
