# Prefix: Ctrl+A (uncomment to override default Ctrl+B)
# set -g prefix C-a
# bind C-a send-prefix
# unbind C-b

# Terminal / neovim compatibility
set -g default-terminal "tmux-256color"
# Truecolor for terminals that do not advertise it. xterm* alone misses
# alacritty and wezterm, which report their own TERM names.
set -as terminal-overrides ',xterm*:Tc,alacritty:Tc,wezterm:Tc,tmux-256color:Tc'
set -sg escape-time 10
set -g focus-events on

# General
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind %
unbind '"'

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Status bar
set -g status-style bg=black,fg=white
set -g window-status-current-style bg=white,fg=black,bold
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%Y-%m-%d"
set -g status-right-length 30

# Clipboard
# `on` (not the default `external`) makes tmux's own copies emit OSC 52, so a
# yank on a remote box travels back through ssh to the terminal you are sitting
# at. Needs a terminal that allows clipboard writes -- in iTerm2 that is
# Settings > General > Selection > "Applications in terminal may access clipboard".
set -g set-clipboard on
set -as terminal-features ',xterm*:clipboard,alacritty:clipboard,wezterm:clipboard,tmux-256color:clipboard'

# Panes
setw -g mode-keys vi

# Copy mode. tmux's vi defaults are Space to select and Enter to copy, and it
# binds v to rectangle-toggle; rebind to the vim keys.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse off by default; prefix+m toggles it
set -g mouse off
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"
